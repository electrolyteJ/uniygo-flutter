name: duel_room2
description: "duel_room1 的 Riverpod 版：等待室 + 决斗场地（不含 Flame 渲染）。"
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.2
  shared_preferences: ^2.5.3
  go_router: ^14.0.0
  flutter_portal: ^1.1.4
  biz:
    path: ../../packages/biz
  duelink:
    path: ../../packages/duelink
  ygo_data:
    path: ../../packages/ygo_data
  riverpod_annotation: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.8

flutter:
  uses-material-design: true
  generate: true
