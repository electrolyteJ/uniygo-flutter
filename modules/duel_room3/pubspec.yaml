name: duel_room3
description: "纯 flame_3d 3D 决斗房间：3D 悬浮竞技场 + 卡图立牌 + MDPro3 风格 UI。"
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  shared_preferences: ^2.5.3
  go_router: ^14.0.0
  flutter_portal: ^1.1.4
  flame: ^1.38.0
  vector_math: ^2.1.4
  # flame_3d 0.3.0 未适配 Flutter 3.47，锁定 monorepo 修复提交并 vendor 到
  # packages/flame_3d（另含 uniygo 补丁：shaderbundle 预载逐资产容错，
  # 否则与 flutter_scene 共存时 ShaderLibrary 初始化随机失败）。
  flame_3d:
    git:
      url: https://github.com/flame-engine/flame.git
      path: packages/flame_3d
      ref: 0453bad6e726ff90610baec86e5c24dc4c89a5a4
  biz:
    path: ../../packages/biz
  duelink:
    path: ../../packages/duelink
  ygo_data:
    path: ../../packages/ygo_data
  riverpod_annotation: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.8

flutter:
  uses-material-design: true
