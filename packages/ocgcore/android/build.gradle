group = "com.e.ocgcore"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.3.0")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.e.ocgcore"
    compileSdk = 35

    defaultConfig {
        minSdk = 21
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // 已切换为源码构建(externalNativeBuild),预编译产物保留在
            // src/main/jniLibs.prebuilt 以备回退,不再参与打包。
            jniLibs.srcDirs = []
        }
    }
}
