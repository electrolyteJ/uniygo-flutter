name: ocgcore
description: "YGOPRO ocgcore duel engine — Dart FFI/WASM bindings."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

resolution: workspace

dependencies:
  applog:
    path: ../applog
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  ffi: ^2.1.3
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  wasm_bridge:
    path: ../wasm_bridge

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      web:
        pluginClass: OcgCoreWebPlugin
        fileName: src/ocgcore_bindings_generated.web.dart

  assets:
    - web/libs/libocgcore.js
    - web/libs/libocgcore.wasm
    # 包内符号链接 → 根目录 vendor/scripts（避免资产路径越界）。
    # 越界声明（../../vendor/scripts/）会触发 flutter run web dev 模式把
    # 全部脚本复制到 app 源码目录（apps/uniygopro/vendor）。
    - vendor/scripts/
