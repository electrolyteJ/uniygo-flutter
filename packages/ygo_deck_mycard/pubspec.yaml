name: ygo_deck_mycard
description: "Local deck service — YDK import/export, built-in decks, local persistence via ygo_storage."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ygo_data:
    path: ../ygo_data
  ygo_storage:
    path: ../ygo_storage
  service_loader:
    path: ../service_loader

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/decks/
    - vendor/ygopro-card-list/pack/
