name: ygo_agent_tflite
description: >-
  On-device LiteRT (TFLite) runtime wrapper for the ygo-agent 0546_26550M
  model; exposes ygo_agent's ModelFn backed by flutter_litert.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_litert: ^3.8.0
  ygo_agent:
    path: ../ygo_agent

dev_dependencies:
  archive: ^4.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
