name: duelink_ai_edo
description: Puzzle (残局) duel implementation for duelink using OCGCore engine.
version: 0.0.1
environment:
  sdk: ^3.12.2
resolution: workspace
publish_to: 'none'

dependencies:
  flutter:
    sdk: flutter
  duelink:
    path: ../duelink
  duelink_ai:
    path: ../duelink_ai
  ocgcore:
    path: ../ocgcore
  ocgcore_edo:
    path: ../ocgcore_edo
  resource_data:
    path: ../resource_data
  async: ^2.11.0
  service_loader:
    path: ../service_loader


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
    assets:
      # CardScripts 根目录的基础/工具脚本（25 个）
