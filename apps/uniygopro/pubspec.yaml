name: uniygopro
description: "A Yu-Gi-Oh! Pro game client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ocgcore:
    path: ../../packages/ocgcore
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  audioplayers: ^6.8.1
  flame: ^1.11.0
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4+4
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/cards.cdb
