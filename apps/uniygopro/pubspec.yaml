name: uniygopro
description: "A Yu-Gi-Oh! Pro game client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  applog:
    path: ../../packages/applog
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  audioplayers: ^6.8.1
  flame: ^1.38.0
  path: ^1.9.1
  shared_preferences: ^2.5.3
  service_loader:
    path: ../../packages/service_loader
  cardlive:
    path: ../../modules/cardlive
  deck_editor1:
    path: ../../modules/deck_editor1
  deck_editor3:
    path: ../../modules/deck_editor3
  duel_room1:
    path: ../../modules/duel_room1
  duel_room2:
    path: ../../modules/duel_room2
  duel_room3:
    path: ../../modules/duel_room3
  ygo_settings:
    path: ../../modules/ygo_settings
  resource_storage:
    path: ../../packages/resource_storage
  biz:
    path: ../../packages/biz
  duelink:
    path: ../../packages/duelink
  resource_data:
    path: ../../packages/resource_data
  go_router: ^14.0.0
  http: ^1.2.1
  flutter_portal: ^1.1.4
  web_socket_channel: ^3.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  service_loader_gen:
    path: ../../packages/service_loader_gen

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/duel/
    - assets/sounds/ui/
