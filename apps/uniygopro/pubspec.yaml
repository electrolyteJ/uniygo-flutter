name: uniygopro
description: "A Yu-Gi-Oh! Pro game client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  audioplayers: ^6.8.1
  flame: ^1.38.0
  path: ^1.9.1
  shared_preferences: ^2.5.3
  cardlive:
    path: ../cardlive
  deck_editor1:
    path: ../deck_editor1
  duel_room1:
    path: ../duel_room1
  duel_room2:
    path: ../duel_room2
  duel_settings:
    path: ../duel_settings
  ygo_storage:
    path: ../../packages/ygo_storage
  service_loader:
    path: ../../packages/service_loader
  biz:
    path: ../../packages/biz
  duelink:
    path: ../../packages/duelink
  duelink_websocket:
    path: ../../packages/duelink_websocket
  #  duelink_socket:
  #    path: ../../packages/duelink_socket
  duelink_ai:
    path: ../../packages/duelink_ai
  duelink_ai_edo:
    path: ../../packages/duelink_ai_edo
  ygo_data:
    path: ../../packages/ygo_data
  ygo_card_baige:
    path: ../../packages/ygo_card_baige
  ygo_card_mycard:
    path: ../../packages/ygo_card_mycard
  ygo_banlist_mycard:
    path: ../../packages/ygo_banlist_mycard
  ygo_deck_mdpro3:
    path: ../../packages/ygo_deck_mdpro3
  ygo_deck_mycard:
    path: ../../packages/ygo_deck_mycard
  account_mycard:
    path: ../../packages/account_mycard
  go_router: ^14.0.0
  http: ^1.2.1
  flutter_portal: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  service_loader_gen:
    path: ../../packages/service_loader_gen

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/duel/
    - assets/sounds/ui/
