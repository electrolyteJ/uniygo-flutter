name: duel_room1
description: "从 uniygopro DuelRoomPage 拆出的决斗房间：等待室 + 决斗场地。"
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  audioplayers: ^6.8.1
  flame: ^1.38.0
  shared_preferences: ^2.5.3
  go_router: ^14.0.0
  http: ^1.2.1
  flutter_portal: ^1.1.4
  flutter_animate: ^4.5.0
  biz:
    path: ../../packages/biz
  duelink:
    path: ../../packages/duelink
  ygo_data:
    path: ../../packages/ygo_data
  ygo_banlist_mycard:
    path: ../../packages/ygo_banlist_mycard
  # flame_3d 0.3.0（pub 最新）未适配 Flutter 3.47 的 flutter_gpu API，
  # 锁定 flame monorepo 的修复提交（"fix: Adapt to Flutter 3.47" #3995），
  # 待 0.3.1+ 发布后可切回 hosted。
  flame_3d:
    git:
      url: https://github.com/flame-engine/flame.git
      path: packages/flame_3d
      ref: 0453bad6e726ff90610baec86e5c24dc4c89a5a4
  flutter_scene: ^0.21.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
