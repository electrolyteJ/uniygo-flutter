name: duel_room1
description: "从 uniygopro DuelRoomPage 拆出的决斗房间：等待室 + 决斗场地。"
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  audioplayers: ^6.8.1
  flame: ^1.38.0
  shared_preferences: ^2.5.3
  go_router: ^14.0.0
  http: ^1.2.1
  flutter_portal: ^1.1.4
  flutter_animate: ^4.5.0
  biz:
    path: ../../packages/biz
  duelink:
    path: ../../packages/duelink
  ygo_data:
    path: ../../packages/ygo_data
  ygo_banlist_mycard:
    path: ../../packages/ygo_banlist_mycard
  cardlive:
    path: ../cardlive
  flutter_scene: ^0.21.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
