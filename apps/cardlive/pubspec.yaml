name: cardlive
description: "怪兽召唤动画鉴赏：3D 召唤演出（原 duel_room1 电子龙演出）+ 怪兽列表预览页。"
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  go_router: ^14.0.0
  flutter:
    sdk: flutter
  ygo_data:
    path: ../../packages/ygo_data
  flutter_animate: ^4.5.0
  flutter_scene: ^0.21.1
  flame: ^1.38.0
  # flame_3d 0.3.0（pub 最新）未适配 Flutter 3.47 的 flutter_gpu API，
  # 锁定 flame monorepo 的修复提交（"fix: Adapt to Flutter 3.47" #3995），
  # 待 0.3.1+ 发布后可切回 hosted。
  flame_3d:
    git:
      url: https://github.com/flame-engine/flame.git
      path: packages/flame_3d
      ref: 0453bad6e726ff90610baec86e5c24dc4c89a5a4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
