name: Beta Release Uniygopro(内测渠道)

# 统一内测发布入口，整合原 upload-pgyer.yml。
#
# 渠道路由：
#   国内  Android/iOS → 蒲公英（Pgyer）
#   海外  Android/iOS → Firebase App Distribution
#   海外  桌面端/Web   → GitHub Releases + website 介绍页
#
# 所需 Secrets：
#   蒲公英：
#     PGYER_API_KEY              蒲公英 API Key
#   Firebase App Distribution：
#     FIREBASE_TOKEN             firebase login:ci 产出
#     FIREBASE_ANDROID_APP_ID    形如 1:xxxxxxxx:android:xxxxxxxx
#     FIREBASE_IOS_APP_ID        形如 1:xxxxxxxx:ios:xxxxxxxx
#   iOS 签名（同 upload-pgyer）：
#     IOS_P12_BASE64 / IOS_P12_PASSWORD / IOS_MOBILEPROVISION_BASE64 / IOS_TEAM_ID
#
# 可选 Vars：
#   IOS_EXPORT_METHOD    ad-hoc（默认）/ app-store / enterprise / development
#   IOS_BUNDLE_ID        默认 com.e.uniygopro
#
# 触发：仅手动 workflow_dispatch。

on:
  workflow_dispatch:
    inputs:
      channel:
        description: '发布渠道'
        required: true
        type: choice
        default: both
        options:
          - domestic
          - overseas
          - both
      build_android:
        description: '构建 Android'
        required: true
        default: true
        type: boolean
      build_ios:
        description: '构建 iOS（需签名证书）'
        required: true
        default: false
        type: boolean
      build_desktop:
        description: '构建桌面端（Windows/Linux/macOS）→ GitHub Releases'
        required: true
        default: false
        type: boolean
      release_name:
        description: '预发布版本名（如 1.2.3-beta.1），同时用作 Git tag；留空自动用 beta-<提交SHA>'
        required: false
        default: ''
        type: string
      release_notes:
        description: '更新说明（留空取 commit message）'
        required: false
        default: ''
        type: string
      pgyer_install_password:
        description: '蒲公英安装密码（留空公开安装，仅国内渠道）'
        required: false
        default: ''
        type: string

env:
  FLUTTER_VERSION: '3.47.0'
  APP_NAME: 'uniygopro'
  APP_DIR: 'apps/uniygopro'

permissions:
  contents: write

jobs:
  # ============================================================
  # Android：构建签名 APK → 蒲公英（国内）/ Firebase App Distribution（海外）
  # ============================================================
  android:
    name: Android Beta
    runs-on: ubuntu-latest
    if: inputs.build_android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # 发布签名材料已入库（android/key.properties + upload-keystore.jks），
      # build.gradle.kts 检测到 key.properties 自动启用发布签名。

      - name: Install dependencies
        run: flutter pub get
        working-directory: ${{ env.APP_DIR }}

      - name: Build APK (Release)
        run: flutter build apk --release
        working-directory: ${{ env.APP_DIR }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # ---------- 国内：蒲公英 ----------
      - name: Upload to Pgyer (国内)
        if: ${{ inputs.channel == 'domestic' || inputs.channel == 'both' }}
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          UPDATE_DESC: ${{ inputs.release_notes || github.event.head_commit.message }}
          INSTALL_PASSWORD: ${{ inputs.pgyer_install_password }}
        run: |
          if [ -z "${PGYER_API_KEY:-}" ]; then
            echo "::error::缺少 secret: PGYER_API_KEY"
            exit 1
          fi
          APK="$APP_DIR/build/app/outputs/flutter-apk/app-release.apk"
          ARGS=(-F "_api_key=$PGYER_API_KEY" -F "file=@$APK" -F "buildUpdateDescription=$UPDATE_DESC")
          if [ -n "$INSTALL_PASSWORD" ]; then
            ARGS+=(-F "buildInstallType=2" -F "buildPassword=$INSTALL_PASSWORD")
          fi
          RESP=$(curl -sS "${ARGS[@]}" https://www.pgyer.com/apiv2/app/upload)
          echo "$RESP"
          CODE=$(echo "$RESP" | jq -r '.code')
          if [ "$CODE" != "0" ]; then
            echo "::error::蒲公英上传失败: $(echo "$RESP" | jq -r '.message')"
            exit 1
          fi
          SHORT=$(echo "$RESP" | jq -r '.data.buildShortcutUrl')
          echo "蒲公英安装页: https://www.pgyer.com/$SHORT"

      # ---------- 海外：Firebase App Distribution ----------
      - name: Upload to Firebase App Distribution (海外)
        if: ${{ inputs.channel == 'overseas' || inputs.channel == 'both' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          RELEASE_NOTES: ${{ inputs.release_notes || github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "::error::缺少 secret: FIREBASE_TOKEN（npm i -g firebase-tools && firebase login:ci 获取）"
            exit 1
          fi
          if [ -z "${FIREBASE_APP_ID:-}" ]; then
            echo "::error::缺少 secret: FIREBASE_ANDROID_APP_ID（Firebase 控制台 → 项目设置 → 应用 ID）"
            exit 1
          fi
          APK="$APP_DIR/build/app/outputs/flutter-apk/app-release.apk"
          npx -y firebase-tools@15.28.1 appdistribution:distribute "$APK" \
            --app "$FIREBASE_APP_ID" --token "$FIREBASE_TOKEN" \
            --release-notes "$RELEASE_NOTES" --non-interactive

  # ============================================================
  # iOS：构建签名 IPA → 蒲公英（国内）/ Firebase App Distribution（海外）
  # ============================================================
  ios:
    name: iOS Beta
    runs-on: macos-latest
    if: inputs.build_ios
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.e.uniygopro' }}
      IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'ad-hoc' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios && pod install
        working-directory: ${{ env.APP_DIR }}

      - name: Import signing certificate & provisioning profile
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -e
          KEYCHAIN=ci-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_P12_BASE64" | base64 -d > /tmp/dist.p12
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$IOS_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f /tmp/dist.p12

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 -d > /tmp/profile.mobileprovision
          PROFILE_UUID=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract UUID raw -)
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm -f /tmp/profile.mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Archive (manual signing)
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive archive \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"
        working-directory: ${{ env.APP_DIR }}

      - name: Export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$IOS_EXPORT_METHOD</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>$IOS_BUNDLE_ID</key><string>$PROFILE_UUID</string></dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist -exportPath build/ios/ipa
        working-directory: ${{ env.APP_DIR }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ env.APP_DIR }}/build/ios/ipa/*.ipa
          retention-days: 30

      # ---------- 国内：蒲公英 ----------
      - name: Upload to Pgyer (国内)
        if: ${{ inputs.channel == 'domestic' || inputs.channel == 'both' }}
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          UPDATE_DESC: ${{ inputs.release_notes || github.event.head_commit.message }}
          INSTALL_PASSWORD: ${{ inputs.pgyer_install_password }}
        run: |
          if [ -z "${PGYER_API_KEY:-}" ]; then
            echo "::error::缺少 secret: PGYER_API_KEY"
            exit 1
          fi
          IPA=$(ls "$APP_DIR"/build/ios/ipa/*.ipa | head -1)
          ARGS=(-F "_api_key=$PGYER_API_KEY" -F "file=@$IPA" -F "buildUpdateDescription=$UPDATE_DESC")
          if [ -n "$INSTALL_PASSWORD" ]; then
            ARGS+=(-F "buildInstallType=2" -F "buildPassword=$INSTALL_PASSWORD")
          fi
          RESP=$(curl -sS "${ARGS[@]}" https://www.pgyer.com/apiv2/app/upload)
          echo "$RESP"
          CODE=$(echo "$RESP" | jq -r '.code')
          if [ "$CODE" != "0" ]; then
            echo "::error::蒲公英上传失败: $(echo "$RESP" | jq -r '.message')"
            exit 1
          fi
          echo "蒲公英安装页: https://www.pgyer.com/$(echo "$RESP" | jq -r '.data.buildShortcutUrl')"

      # ---------- 海外：Firebase App Distribution ----------
      - name: Upload to Firebase App Distribution (海外)
        if: ${{ inputs.channel == 'overseas' || inputs.channel == 'both' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          RELEASE_NOTES: ${{ inputs.release_notes || github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "::error::缺少 secret: FIREBASE_TOKEN"
            exit 1
          fi
          if [ -z "${FIREBASE_APP_ID:-}" ]; then
            echo "::error::缺少 secret: FIREBASE_IOS_APP_ID"
            exit 1
          fi
          IPA=$(ls "$APP_DIR"/build/ios/ipa/*.ipa | head -1)
          npx -y firebase-tools@15.28.1 appdistribution:distribute "$IPA" \
            --app "$FIREBASE_APP_ID" --token "$FIREBASE_TOKEN" \
            --release-notes "$RELEASE_NOTES" --non-interactive

  # ============================================================
  # 桌面端：Windows / Linux / macOS → GitHub Releases（海外任意平台）
  # ============================================================
  desktop:
    name: Desktop (${{ matrix.target }})
    if: inputs.build_desktop && (inputs.channel == 'overseas' || inputs.channel == 'both')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libblkid-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev librsync-dev libcurl4-openssl-dev \
            clang cmake pkg-config libssl-dev libunwind-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libmpv-dev

      - name: Build libocgcore.dll (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          cmake -S packages/ocgcore/native -B packages/ocgcore/native/build -A x64
          cmake --build packages/ocgcore/native/build --config Release
          New-Item -ItemType Directory -Force packages/ocgcore/windows/libs/x64 | Out-Null
          Copy-Item packages/ocgcore/native/build/Release/ocgcore.dll packages/ocgcore/windows/libs/x64/ocgcore.dll

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: ${{ env.APP_DIR }}

      - name: Build ${{ matrix.target }} (Release)
        run: flutter build ${{ matrix.target }} --release
        working-directory: ${{ env.APP_DIR }}

      - name: Package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $BUILD_DIR = "$env:APP_DIR\build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "$BUILD_DIR\*" -DestinationPath "artifacts/${env:APP_NAME}-${{ matrix.target }}-x86_64.zip" -Force

      - name: Package Linux
        if: matrix.target == 'linux'
        run: |
          mkdir -p artifacts
          BUILD_DIR="$APP_DIR/build/linux/x64/release/bundle"
          tar -czf "artifacts/${APP_NAME}-${{ matrix.target }}-x86_64.tar.gz" -C "$BUILD_DIR" .

      - name: Package macOS
        if: matrix.target == 'macos'
        run: |
          mkdir -p artifacts
          APP_NAME_CAP=$(echo "${APP_NAME}" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
          BUILD_DIR="$APP_DIR/build/macos/Build/Products/Release"
          cd "$BUILD_DIR"
          hdiutil create -volname "${APP_NAME}" -srcfolder "${APP_NAME_CAP}.app" -ov -format UDZO \
            "${{ github.workspace }}/artifacts/${APP_NAME}-${{ matrix.target }}.dmg"
          tar -czf "${{ github.workspace }}/artifacts/${APP_NAME}-${{ matrix.target }}.tar.gz" "${APP_NAME_CAP}.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: artifacts/*
          retention-days: 30

  # ============================================================
  # Release：收集 Android / iOS / 桌面端产物 → 创建 GitHub Release
  # ============================================================
  github-release:
    name: GitHub Release (海外全平台)
    needs: [android, ios, desktop]
    if: always() && (inputs.build_android || inputs.build_ios || inputs.build_desktop) && (inputs.channel == 'overseas' || inputs.channel == 'both')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android artifact
        if: always() && inputs.build_android
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts
          merge-multiple: true

      - name: Download iOS artifact
        if: always() && inputs.build_ios
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: artifacts
          merge-multiple: true

      - name: Download desktop artifacts
        if: always() && inputs.build_desktop
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/ || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_name || format('beta-{0}', github.sha) }}
          target_commitish: ${{ github.sha }}
          name: Beta ${{ inputs.release_name || github.sha }}
          body: ${{ inputs.release_notes || github.event.head_commit.message }}
          prerelease: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # MkDocs：通过 repository_dispatch 触发版本列表页重新生成与部署
  # ============================================================
  trigger-mkdocs:
    name: Trigger MkDocs Beta Site Deploy
    needs: [github-release]
    if: (inputs.build_android || inputs.build_ios || inputs.build_desktop) && (inputs.channel == 'overseas' || inputs.channel == 'both')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy-mkdocs via repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # repository_dispatch 不会受 concurrency group 冲突影响，
          # deploy-mkdocs.yml 监听 types: [beta-released] 自动重新拉取 Releases 并部署
          gh api -X POST \
            "/repos/${{ github.repository }}/dispatches" \
            -f event_type=beta-released \
            -f client_payload[tag]="${{ inputs.release_name || format('beta-{0}', github.sha) }}"
          echo "已触发 MkDocs 版本列表页重新部署。"
