name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.0'
  APP_DIR: 'apps/uniygopro'

jobs:
  build:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd $APP_DIR
          flutter pub get

      - name: Build Web (Release)
        run: |
          cd $APP_DIR
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Remove oversized GLB from web build
        run: |
          # Web 端 cardlive 不渲染 3D（kIsWeb 分支），GLB 不会被请求，剔除可减小包体积
          find $APP_DIR/build/web -name "*.glb" -size +25M -delete
          echo "web build 中剩余 GLB:"
          find $APP_DIR/build/web -name "*.glb" -exec du -h {} \;

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.APP_DIR }}/build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
