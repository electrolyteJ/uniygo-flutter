name: Deploy Web to Cloudflare Workers (Static Assets)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.0'
  APP_DIR: 'apps/uniygopro'

jobs:
  deploy:
    name: Build & Deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd ${{ env.APP_DIR }}
          flutter pub get

      - name: Build Web (Release)
        run: |
          cd ${{ env.APP_DIR }}
          # Cloudflare Workers 部署在根路径（<name>.<account>.workers.dev 或自定义域名），无需 base-href
          flutter build web --release

      - name: Trim web build for Cloudflare free tier
        run: |
          # 1) Web 端 cardlive 不渲染 3D（kIsWeb 分支），GLB 不会被请求；且 Workers 资产单文件上限 25 MiB
          find ${{ env.APP_DIR }}/build/web -name "*.glb" -size +25M -delete
          # 2) Web 端不支持残局 Puzzle（duelink_ai_edo / ocgcore_edo），剔除其资产：
          #    Workers 免费版每版本限 20,000 静态文件，ocgcore_edo 的 CardScripts 有 22,590 个 lua
          rm -rf ${{ env.APP_DIR }}/build/web/assets/packages/ocgcore_edo
          echo "=== 清理后统计 ==="
          echo "lua 文件数: $(find ${{ env.APP_DIR }}/build/web -name '*.lua' | wc -l)"
          echo "总文件数: $(find ${{ env.APP_DIR }}/build/web -type f | wc -l)"
          echo "GLB: $(find ${{ env.APP_DIR }}/build/web -name '*.glb' -exec du -h {} \;)"

      - name: Deploy to Cloudflare Workers (Static Assets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::缺少 secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          cd ${{ env.APP_DIR }}
          # wrangler.jsonc 配置 assets 指向 build/web + SPA 回退；
          # wrangler deploy 首次自动创建 Worker，无需预先建 Pages 项目
          npx wrangler@4.124.0 deploy
