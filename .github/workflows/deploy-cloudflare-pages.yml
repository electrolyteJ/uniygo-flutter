name: Deploy Web to Cloudflare Workers (Static Assets)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.0'
  APP_DIR: 'apps/uniygopro'

jobs:
  deploy:
    name: Build & Deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd ${{ env.APP_DIR }}
          flutter pub get

      - name: Build Web (Release)
        run: |
          cd ${{ env.APP_DIR }}
          # Cloudflare Workers 部署在根路径（<name>.<account>.workers.dev 或自定义域名），无需 base-href
          flutter build web --release

      - name: Remove oversized GLB from web build
        run: |
          # Web 端 cardlive 不渲染 3D（kIsWeb 分支），GLB 不会被请求；
          # 且 Workers 资产单文件上限 25 MiB，超限文件会导致部署失败。
          find ${{ env.APP_DIR }}/build/web -name "*.glb" -size +25M -delete
          echo "web build 中剩余 GLB:"
          find ${{ env.APP_DIR }}/build/web -name "*.glb" -exec du -h {} \;

      - name: Deploy to Cloudflare Workers (Static Assets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::缺少 secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          cd ${{ env.APP_DIR }}
          # wrangler.jsonc 配置 assets 指向 build/web + SPA 回退；
          # wrangler deploy 首次自动创建 Worker，无需预先建 Pages 项目
          npx wrangler@4.124.0 deploy
