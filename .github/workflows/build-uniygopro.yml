name: Build & Release uniygopro

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android (APK/AAB)'
        required: true
        default: true
        type: boolean
      build_windows:
        description: 'Build Windows'
        required: true
        default: true
        type: boolean
      build_linux:
        description: 'Build Linux'
        required: true
        default: true
        type: boolean
      build_web:
        description: 'Build Web'
        required: true
        default: true
        type: boolean
      build_macos:
        description: 'Build macOS'
        required: true
        default: false
        type: boolean
      build_ios:
        description: 'Build iOS (requires certs)'
        required: true
        default: false
        type: boolean
      upload_to_release:
        description: 'Upload to GitHub Release'
        required: true
        default: true
        type: boolean

env:
  FLUTTER_VERSION: '3.47.0'
  APP_NAME: 'uniygopro'
  APP_DIR: 'apps/uniygopro'

permissions:
  contents: write

jobs:
  # ============================================================
  # Android Build - APK & AAB
  # ============================================================
  build-android:
    name: Build Android (APK/AAB)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.build_android }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd $APP_DIR
          flutter pub get

      - name: Build APK (Release)
        run: |
          cd $APP_DIR
          flutter build apk --release --split-per-abi

      - name: Build App Bundle (Release)
        run: |
          cd $APP_DIR
          flutter build appbundle --release

      - name: Rename Android artifacts
        run: |
          mkdir -p artifacts/android
          VERSION=${GITHUB_REF_NAME:-${GITHUB_SHA::7}}
          cp $APP_DIR/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifacts/android/${APP_NAME}-${VERSION}-arm64-v8a.apk
          cp $APP_DIR/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifacts/android/${APP_NAME}-${VERSION}-armeabi-v7a.apk
          cp $APP_DIR/build/app/outputs/flutter-apk/app-x86_64-release.apk artifacts/android/${APP_NAME}-${VERSION}-x86_64.apk
          cp $APP_DIR/build/app/outputs/bundle/release/app-release.aab artifacts/android/${APP_NAME}-${VERSION}.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: artifacts/android/*

  # ============================================================
  # Windows Build
  # ============================================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    if: ${{ github.event_name == 'push' || inputs.build_windows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd $env:APP_DIR
          flutter pub get

      - name: Build libocgcore.dll (from vendor sources)
        shell: pwsh
        run: |
          # 插件打包需要 packages/ocgcore/windows/libs/x64/ocgcore.dll
          # （未入库，CI 现场从 vendor 源码构建；子模块已 recursive 拉取）
          cmake -S packages/ocgcore/native -B packages/ocgcore/native/build -A x64
          cmake --build packages/ocgcore/native/build --config Release
          New-Item -ItemType Directory -Force packages/ocgcore/windows/libs/x64 | Out-Null
          Copy-Item packages/ocgcore/native/build/Release/ocgcore.dll packages/ocgcore/windows/libs/x64/ocgcore.dll

      - name: Build Windows (Release)
        run: |
          cd $env:APP_DIR
          flutter build windows --release

      - name: Upload libocgcore.dll artifact
        uses: actions/upload-artifact@v4
        with:
          name: libocgcore-windows-x64
          path: packages/ocgcore/windows/libs/x64/ocgcore.dll
          retention-days: 30

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          $VERSION = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0,7) }
          $BUILD_DIR = "$env:APP_DIR\build\windows\x64\runner\Release"
          $ARTIFACTS_DIR = "artifacts\windows"
          New-Item -ItemType Directory -Force -Path $ARTIFACTS_DIR | Out-Null
          $ZIP_NAME = "$env:APP_NAME-$VERSION-windows-x86_64.zip"
          Compress-Archive -Path "$BUILD_DIR\*" -DestinationPath "$ARTIFACTS_DIR\$ZIP_NAME" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/windows/*

  # ============================================================
  # Linux Build
  # ============================================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.build_linux }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libblkid-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev librsync-dev libcurl4-openssl-dev \
            clang cmake pkg-config libssl-dev libunwind-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libmpv-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd $APP_DIR
          flutter pub get

      - name: Build Linux (Release)
        run: |
          cd $APP_DIR
          flutter build linux --release

      - name: Package Linux artifacts
        run: |
          VERSION=${GITHUB_REF_NAME:-${GITHUB_SHA::7}}
          BUILD_DIR="$APP_DIR/build/linux/x64/release/bundle"
          ARTIFACTS_DIR="artifacts/linux"
          mkdir -p $ARTIFACTS_DIR
          tar -czf "${ARTIFACTS_DIR}/${APP_NAME}-${VERSION}-linux-x86_64.tar.gz" -C "$BUILD_DIR" .

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/linux/*

  # ============================================================
  # Web Build
  # ============================================================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.build_web }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd $APP_DIR
          flutter pub get

      - name: Build Web (Release)
        run: |
          cd $APP_DIR
          flutter build web --release --source-maps

      - name: Package Web artifacts
        run: |
          VERSION=${GITHUB_REF_NAME:-${GITHUB_SHA::7}}
          BUILD_DIR="$APP_DIR/build/web"
          ARTIFACTS_DIR="artifacts/web"
          mkdir -p $ARTIFACTS_DIR
          tar -czf "${ARTIFACTS_DIR}/${APP_NAME}-${VERSION}-web.tar.gz" -C "$BUILD_DIR" .
          zip -r "${ARTIFACTS_DIR}/${APP_NAME}-${VERSION}-web.zip" "$BUILD_DIR"/*

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-artifacts
          path: artifacts/web/*

  # ============================================================
  # macOS Build
  # ============================================================
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    if: ${{ (github.event_name == 'push' && false) || inputs.build_macos }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd $APP_DIR
          flutter pub get

      - name: Build macOS (Release)
        run: |
          cd $APP_DIR
          flutter build macos --release

      - name: Package macOS artifacts
        run: |
          VERSION=${GITHUB_REF_NAME:-${GITHUB_SHA::7}}
          BUILD_DIR="$APP_DIR/build/macos/Build/Products/Release"
          ARTIFACTS_DIR="artifacts/macos"
          mkdir -p $ARTIFACTS_DIR
          cd "$BUILD_DIR"
          hdiutil create -volname "${APP_NAME}" -srcfolder "${APP_NAME^}.app" -ov -format UDZO \
            "${ARTIFACTS_DIR}/${APP_NAME}-${VERSION}-macos.dmg"
          tar -czf "${ARTIFACTS_DIR}/${APP_NAME}-${VERSION}-macos.tar.gz" "${APP_NAME^}.app"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/macos/*

  # ============================================================
  # iOS Build (Requires Apple Developer Certificates)
  # ============================================================
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    if: ${{ (github.event_name == 'push' && false) || inputs.build_ios }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd $APP_DIR
          flutter pub get
          cd ios && pod install

      - name: Build iOS (Release - no codesign)
        run: |
          cd $APP_DIR
          flutter build ios --release --no-codesign

      - name: Package iOS artifacts
        run: |
          VERSION=${GITHUB_REF_NAME:-${GITHUB_SHA::7}}
          BUILD_DIR="$APP_DIR/build/ios/Release-iphoneos"
          ARTIFACTS_DIR="artifacts/ios"
          mkdir -p $ARTIFACTS_DIR
          cd "$BUILD_DIR"
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r "${ARTIFACTS_DIR}/${APP_NAME}-${VERSION}-ios.ipa" Payload
          rm -rf Payload

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: artifacts/ios/*

  # ============================================================
  # Release - Collect & Upload to GitHub Release
  # ============================================================
  release:
    name: Upload to GitHub Release
    needs: [build-android, build-windows, build-linux, build-web]
    if: ${{ always() && (github.event_name == 'push' || inputs.upload_to_release) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
