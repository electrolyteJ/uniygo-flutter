name: Upload to Pgyer (蒲公英)

# 构建 Android APK / iOS IPA 并上传到蒲公英分发平台。
#
# 需要的 Secrets：
#   PGYER_API_KEY              蒲公英 API Key（https://www.pgyer.com/account/api）
#
#   Android 发布签名：key.properties 与 app/upload-keystore.jks 已入库，
#   build.gradle.kts 检测到 key.properties 自动启用发布签名，无需配置。
#
#   iOS 签名（必须，否则 iOS job 不可用）：
#   IOS_P12_BASE64             base64 编码的发布证书 .p12
#   IOS_P12_PASSWORD           p12 导出密码
#   IOS_MOBILEPROVISION_BASE64 base64 编码的 .mobileprovision 描述文件
#   IOS_TEAM_ID                Apple Developer Team ID
#
# 可选的 Vars：
#   IOS_EXPORT_METHOD    导出方式：ad-hoc（默认）/ app-store / enterprise / development
#   IOS_BUNDLE_ID        默认 com.e.uniygopro

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: '构建并上传 Android APK'
        required: true
        default: true
        type: boolean
      build_ios:
        description: '构建并上传 iOS IPA（需签名证书）'
        required: true
        default: false
        type: boolean
      update_description:
        description: '蒲公英更新说明（留空则取 commit message）'
        required: false
        default: ''
        type: string
      install_password:
        description: '安装密码（留空则公开安装）'
        required: false
        default: ''
        type: string

env:
  FLUTTER_VERSION: '3.47.0'
  APP_NAME: 'uniygopro'
  APP_DIR: 'apps/uniygopro'

jobs:
  # ============================================================
  # Android：构建 APK → 上传蒲公英
  # ============================================================
  android:
    name: Android → 蒲公英
    runs-on: ubuntu-latest
    if: inputs.build_android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # Android 发布签名材料已入库（android/key.properties +
      # android/app/upload-keystore.jks），build.gradle.kts 检测到
      # key.properties 自动启用发布签名，无需额外步骤。

      - name: Install dependencies
        run: flutter pub get
        working-directory: ${{ env.APP_DIR }}

      - name: Build APK (Release)
        run: flutter build apk --release
        working-directory: ${{ env.APP_DIR }}

      - name: Upload APK to Pgyer
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          UPDATE_DESC: ${{ inputs.update_description || github.event.head_commit.message }}
          INSTALL_PASSWORD: ${{ inputs.install_password }}
        run: |
          APK="$APP_DIR/build/app/outputs/flutter-apk/app-release.apk"
          ARGS=(-F "_api_key=$PGYER_API_KEY" -F "file=@$APK" -F "buildUpdateDescription=$UPDATE_DESC")
          if [ -n "$INSTALL_PASSWORD" ]; then
            ARGS+=(-F "buildInstallType=2" -F "buildPassword=$INSTALL_PASSWORD")
          fi
          RESP=$(curl -sS "${ARGS[@]}" https://www.pgyer.com/apiv2/app/upload)
          echo "$RESP"
          CODE=$(echo "$RESP" | jq -r '.code')
          if [ "$CODE" != "0" ]; then
            echo "::error::蒲公英上传失败: $(echo "$RESP" | jq -r '.message')"
            exit 1
          fi
          SHORT=$(echo "$RESP" | jq -r '.data.buildShortcutUrl')
          echo "蒲公英安装页: https://www.pgyer.com/$SHORT"
          echo "pgyer_url=https://www.pgyer.com/$SHORT" >> "$GITHUB_OUTPUT"
        id: pgyer

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ============================================================
  # iOS：手动签名构建 IPA → 上传蒲公英
  # ============================================================
  ios:
    name: iOS → 蒲公英
    runs-on: macos-latest
    if: inputs.build_ios
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.e.uniygopro' }}
      IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'ad-hoc' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios && pod install
        working-directory: ${{ env.APP_DIR }}

      - name: Import signing certificate & provisioning profile
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -e
          # 临时 keychain：隔离 CI 环境，避免污染 runner 默认 login keychain
          KEYCHAIN=ci-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_P12_BASE64" | base64 -d > /tmp/dist.p12
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$IOS_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f /tmp/dist.p12

          # 描述文件：按 UUID 安装到系统约定目录
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 -d > /tmp/profile.mobileprovision
          PROFILE_UUID=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract UUID raw -)
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm -f /tmp/profile.mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Archive (manual signing)
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive archive \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"
        working-directory: ${{ env.APP_DIR }}

      - name: Export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$IOS_EXPORT_METHOD</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>$IOS_BUNDLE_ID</key><string>$PROFILE_UUID</string></dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist -exportPath build/ios/ipa
        working-directory: ${{ env.APP_DIR }}

      - name: Upload IPA to Pgyer
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
          UPDATE_DESC: ${{ inputs.update_description || github.event.head_commit.message }}
          INSTALL_PASSWORD: ${{ inputs.install_password }}
        run: |
          IPA=$(ls "$APP_DIR"/build/ios/ipa/*.ipa | head -1)
          ARGS=(-F "_api_key=$PGYER_API_KEY" -F "file=@$IPA" -F "buildUpdateDescription=$UPDATE_DESC")
          if [ -n "$INSTALL_PASSWORD" ]; then
            ARGS+=(-F "buildInstallType=2" -F "buildPassword=$INSTALL_PASSWORD")
          fi
          RESP=$(curl -sS "${ARGS[@]}" https://www.pgyer.com/apiv2/app/upload)
          echo "$RESP"
          CODE=$(echo "$RESP" | jq -r '.code')
          if [ "$CODE" != "0" ]; then
            echo "::error::蒲公英上传失败: $(echo "$RESP" | jq -r '.message')"
            exit 1
          fi
          echo "蒲公英安装页: https://www.pgyer.com/$(echo "$RESP" | jq -r '.data.buildShortcutUrl')"

      - name: Upload IPA artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ env.APP_DIR }}/build/ios/ipa/*.ipa
          retention-days: 30
