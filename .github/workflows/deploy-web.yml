name: Deploy Web (Cloudflare + Firebase)

# 构建 Flutter Web 并部署到双渠道：
#   国内：Cloudflare Workers（Static Assets）
#   海外：Firebase Hosting
#
# 两个渠道独立部署，按需配置 secret：
#   Cloudflare：CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
#   Firebase ：FIREBASE_TOKEN / FIREBASE_PROJECT_ID
# 未配置 secret 的渠道自动跳过，不会导致 workflow 失败。
#
# 触发：
#   push main：代码变更自动部署
#   workflow_dispatch：手动
#   repository_dispatch：prod-released / beta-released 事件（正式/内测发布后联动）
#   workflow_call：被其他 workflow 调用

on:
  push:
    branches:
      - main
    paths:
      - 'apps/uniygopro/**'
      - 'packages/**'
      - 'modules/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [prod-released, beta-released]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.0'
  APP_DIR: 'apps/uniygopro'

jobs:
  build:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd ${{ env.APP_DIR }}
          flutter pub get

      - name: Build Web (Release)
        run: |
          cd ${{ env.APP_DIR }}
          # Cloudflare / Firebase 都部署在根路径，无需 base-href
          flutter build web --release

      - name: Trim web build
        run: |
          # 1) Web 端 cardlive 不渲染 3D（kIsWeb 分支），GLB 不会被请求；Workers 资产单文件上限 25 MiB
          find ${{ env.APP_DIR }}/build/web -name "*.glb" -size +25M -delete
          # 2) Web 端不支持残局 Puzzle（duelink_ai_edo / ocgcore_edo），剔除其资产：
          #    Workers 免费版每版本限 20,000 静态文件，ocgcore_edo 的 CardScripts 有 22,590 个 lua
          rm -rf ${{ env.APP_DIR }}/build/web/assets/packages/ocgcore_edo
          echo "=== 清理后统计 ==="
          echo "lua 文件数: $(find ${{ env.APP_DIR }}/build/web -name '*.lua' | wc -l)"
          echo "总文件数: $(find ${{ env.APP_DIR }}/build/web -type f | wc -l)"
          echo "GLB: $(find ${{ env.APP_DIR }}/build/web -name '*.glb' -exec du -h {} \;)"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: ${{ env.APP_DIR }}/build/web
          retention-days: 7

  deploy-cloudflare:
    name: Deploy to Cloudflare (国内)
    needs: build
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ${{ env.APP_DIR }}/build/web

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd ${{ env.APP_DIR }}
          # wrangler.jsonc 配置 assets 指向 build/web + SPA 回退；
          # wrangler deploy 首次自动创建 Worker，无需预先建 Pages 项目
          npx wrangler@4.124.0 deploy
          echo "::notice::Cloudflare 部署完成: https://uniygopro.electrolytej.workers.dev/"

  deploy-firebase:
    name: Deploy to Firebase Hosting (海外)
    needs: build
    runs-on: ubuntu-latest
    if: ${{ secrets.FIREBASE_TOKEN != '' && secrets.FIREBASE_PROJECT_ID != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ${{ env.APP_DIR }}/build/web

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          cd ${{ env.APP_DIR }}
          # firebase.json 的 public 指向 build/web，rewrites 保证 SPA 路由回退到 index.html
          npx -y firebase-tools@15.28.1 deploy --only hosting --project "${FIREBASE_PROJECT_ID}" --token "${FIREBASE_TOKEN}" --non-interactive
          echo "::notice::Firebase Hosting 部署完成: https://${FIREBASE_PROJECT_ID}.web.app/"
