name: Deploy Web to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.0'
  APP_DIR: 'apps/uniygopro'

jobs:
  deploy:
    name: Build & Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd ${{ env.APP_DIR }}
          flutter pub get

      - name: Build Web (Release)
        run: |
          cd ${{ env.APP_DIR }}
          # Firebase Hosting 部署在根路径（<project>.web.app 或自定义域名），无需 base-href
          flutter build web --release

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "::error::缺少 secret: FIREBASE_TOKEN（在仓库 Settings → Secrets and variables 配置）"
            echo "::error::获取方式：npm install -g firebase-tools && firebase login:ci"
            exit 1
          fi
          if [ -z "${FIREBASE_PROJECT_ID:-}" ]; then
            echo "::error::缺少 secret: FIREBASE_PROJECT_ID（Firebase 控制台 → 项目设置 → 项目 ID）"
            exit 1
          fi
          cd ${{ env.APP_DIR }}
          # firebase.json 的 public 指向 build/web，rewrites 保证 SPA 路由回退到 index.html
          npx -y firebase-tools@15.28.1 deploy --only hosting --project "${FIREBASE_PROJECT_ID}" --token "${FIREBASE_TOKEN}" --non-interactive
